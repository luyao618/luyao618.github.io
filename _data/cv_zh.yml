# Chinese strings for the bilingual CV page (/cv/).
# Sibling to _data/cv.yml so RenderCV's strict pydantic schema for cv.yml
# stays untouched — cv.yml is the canonical English source for the PDF
# render workflow; this file only feeds the Jekyll page.
#
# Section TITLES (the keys of cv.yml's `sections:`) intentionally stay
# in English; this file translates BODY content only. Lists below are
# ordered to match cv.yml exactly so cv.md can pair items by index.
#
# Translation policy:
#   - 专有名词、产品名、技术栈一律保留英文，不加括注
#   - 数据原样保留（46.3% → 31.93% 等）
#   - 中英混排时英文术语前后留半角空格
#   - 量词能省则省（不写"构建一个 agent"，写"构建 agent"）
#   - 避免英语腔（前提下 / 现已 / 驱动……提升 等）
#
# English-by-design fields (intentionally NOT translated; static-render
# audit MUST exclude these from the "no Chinese chars" check):
#   - open_source_projects.*.name      — project names are proper nouns
#   - awards.*.awarder                 — awarding org names are proper nouns
#   - skills.*.name                    — technical skill group names; per
#                                        user rule "技术栈一律保留英文"
#   - any KPI / tech-stack token embedded inside a bullet (Microsoft /
#     Copilot Mac / KQL / Picasso / WAU / Voice Thumb-Down Rate /
#     OpenAI Agent SDK / Neo4j …)

