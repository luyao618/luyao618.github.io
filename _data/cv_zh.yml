    在微软持续拓展全栈开发和 AI Agent 工程能力，关注如何把数据、产品系统和 LLM 工程结合成可交付的软件。
    开源社区活跃者，GitHub 原创公开仓库收获 1.6K+ 星标，并在 OpenClaw、Hermes 等项目中有可核验合入贡献。

