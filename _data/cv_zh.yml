# Chinese strings for the bilingual CV page (/cv/).
# Kept in a sibling file to _data/cv.yml so RenderCV's strict schema is not
# disturbed: cv.yml stays the canonical English source for PDF rendering,
# cv_zh.yml only feeds the Jekyll page.
#
# Section TITLES (the keys in cv.yml's `sections:` map) stay English by
# decision; this file translates BODY content only. Lists below are ordered
# to match cv.yml exactly so cv.md can pair items by index.
# Proper nouns (companies, products, KPIs, tech stack) intentionally stay
# in English inside the Chinese text, with no parenthetical annotation.

