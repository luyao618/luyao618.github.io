cv:
  name: Yao Lu
  label: Big Data Engineer · Full-Stack Builder · AI Agent Developer
  email: 364939526@qq.com
  phone: "+86 136 9977 4962"
  location: Suzhou / Hangzhou / Shanghai, China
  image: /assets/img/profile-lu-yao.jpeg
  summary: >-
    Big data engineer and data analyst with 10 years of hands-on experience
    across data platforms, warehouses, streaming systems, user profiling, and
    business analytics. At Microsoft, expanded into full-stack development and
    AI Agent engineering, with a focus on turning data, product systems, and
    LLM workflows into usable software. Active open-source builder with 1.6K+
    stars across original public repositories and verified merged contributions
    to OpenClaw and Hermes Agent.

  sections:
    # ----------------------------------------------------------------
    # Section 2 — Career Timeline (rendered as "Experience" by the gem,
    # which always appears right after Contact + Summary).
    # ----------------------------------------------------------------
    Experience:
      - position: Senior Software Engineer
        company: Microsoft (STCA · Bing / Skype / Copilot)
        location: Suzhou, China
        start_date: "2022-04"
        end_date: ""
        summary: >-
          Owned data and quality work across Bing App / Start App, Skype,
          Copilot Mac, and Surfaces Connectivity in STCA WebXT / MAI. Started
          as the data owner for business metrics and warehouse foundations,
          then expanded into cross-surface telemetry, experiment scorecards,
          quality root-cause analysis, and AI-native data workflows.
        highlights:
          - >-
            Nov 2025 - Apr 2026 · Cross-Surface Connectivity quality analytics:
            moved into Surfaces Connectivity and owned no-response,
            actionable-rate, and chat-funnel analysis for Mac / CMC. Built
            Mobile-aligned KQL, Grafana dashboards, Geneva monitors, and
            baselines for Mac, and separated real product failures from
            telemetry artifacts such as CMC bot-filter issues and background-tab
            1DS terminal-event loss.
          - >-
            Feb 2025 - Nov 2025 · Copilot Mac data and quality system: rebuilt
            core metrics, quality monitoring, experiment scorecards, and
            feature dashboards while the Mac data foundation was still thin.
            Set up the ICM framework, daily / weekly OCV reviews, and LT / PM
            review cadence; drove telemetry guidance, native-rewrite backfill,
            and voice-funnel analysis so retention, WAU, and Voice TDR could be
            tracked, explained, and improved reliably.
          - >-
            Apr 2022 - Feb 2025 · Bing App MiniApp / Growth / Acquisition data:
            covered Bing App MiniApp modules such as Rewards, Wallpaper, and
            Weather, then later Growth / Acquisition work. Owned core metrics,
            dashboards, funnels, and ROI / LTV analysis for PM, operations, and
            growth teams, supporting feature evaluation, Paid Ads efficiency,
            Upsell funnels, and user-profile analysis.
          - >-
            Apr 2022 - Feb 2025 · Skype call quality and data foundation: led
            the Skype call-quality funnel from telemetry cleanup and dashboard
            design to optimization-point discovery and impact sizing. Also
            modeled key warehouse modules and built ODS / DWS tables for PM
            dashboards, dev debugging, AB scorecards, and quality reviews.
      - position: Senior Software Engineer
        company: Xiaomi (Big Data · User Profile · MiPush)
        location: Beijing & Nanjing, China
        start_date: "2019-04"
        end_date: "2022-03"
        summary: >-
          Worked on PB-scale processing, real-time and offline reporting,
          Android competitor analytics, DMP labels, and device-swap definitions
          across MiPush and user-profile systems. Served as technical owner in a
          six-person data team, covering core implementation, task breakdown,
          scheduling, code review, interviews, onboarding, and cross-team
          communication.
        highlights:
          - >-
            Apr 2021 - Mar 2022 · User profile: Xiaomi device-swap data. Led the
            initial definition, modeling, implementation, and validation of a
            group-level device-swap taxonomy, handling multi-SIM,
            multi-owner, and multi-device-transfer cases. Delivered swap labels
            with 90%+ accuracy and 80% monthly-active coverage, later reused by
            multiple phone-business teams for loyalty, acquisition profiling,
            and phone-business strategy analysis.
          - >-
            Apr 2019 - Apr 2021 · MiPush Android competitor analytics: took over
            a legacy competitor-statistics system with 20+ compute jobs and
            tens of thousands of lines of code, then built vendor-level new and
            active device metrics on PB-scale MiPush data. Reduced error versus
            BCI from 50%+ to 10% through cleaning, mapping, and OAID
            compatibility work, and completed the Kylin / Redash visualization
            path.
          - >-
            Apr 2019 - Apr 2021 · MiPush sales enablement and DMP labels: as the
            main developer for phase one, designed the text-mining warehouse and
            project framework, implemented core parts of 30+ tables, built
            purchase-intent scores and intended-brand labels, and supplied
            feature data for algorithm models used in Mi Mall retention,
            inventory clearance, and precision marketing.
          - >-
            Apr 2019 - Apr 2021 · MiPush statistics platform: led the rewrite of
            the MiPush statistics platform for internal Xiaomi business teams
            and external developers, covering selected audience, sent, received,
            clicked, CTR, and hourly receive / click reports. Reworked old
            pulse-style HBase writes and poor data modeling, improving
            stability and reducing storage by nearly RMB 1M per year.
      - position: Big Data Engineer
        company: Meitu (Risk Control)
        location: Shenzhen, China
        start_date: "2018-04"
        end_date: "2019-03"
        summary: >-
          Built real-time stream-processing, rule-engine, anomaly-detection,
          and alerting systems for community risk control and metric
          monitoring, turning PM rules, algorithm models, and production alerts
          into operational systems.
        highlights:
          - >-
            Apr 2018 - Mar 2019 · Real-time risk-control rule engine: built a
            low-latency review engine for Meitu community scenarios including
            private messages, follows, content publishing, and text creation.
            Used Spark Streaming + Kafka to expose real-time logs as queryable
            in-memory tables, QLExpress for self-service rule configuration by
            risk PMs, and text similarity / classification models plus
            SQL-like factors to shorten rule rollout cycles and reduce manual
            cost.
          - >-
            Apr 2018 - Mar 2019 · Data monitoring and alerting system: main
            developer on a company-wide metric monitoring platform for internal
            data teams. Ingested hundreds of millions of metrics and ran
            time-series anomaly models with 98%+ precision on detected
            anomalies; owned key Spark ingestion / rerun / query modules, Redis
            signal management, Livy service integration, and email alerting.
      - position: Big Data Engineer
        company: Skyworth Coocaa (Data Platform)
        location: Shenzhen, China
        start_date: "2016-07"
        end_date: "2018-03"
        summary: >-
          Early data-platform engineer and core developer / owner across DMP,
          BI ETL, streaming, tag systems, and data-mining capabilities as the
          data team was being built from scratch.
        highlights:
          - >-
            Jul 2016 - Mar 2018 · DMP platform: core 0-to-1 developer for user
            tags, audience selection, and profile analytics used by operations
            and marketing teams. The platform covered about 20M users and close
            to 100 tags, used HyperLogLog for fast audience sizing, Spark UDF /
            UDAF for profile metrics, and task optimization that shortened new
            tag jobs by about one hour.
          - >-
            Jul 2016 - Mar 2018 · BI platform and smart-TV behavior streaming:
            built and maintained playback behavior tables and related ETL for
            BI reports used by analysts and management. Developed dozens of
            Hive UDFs, used Redis sorted sets + Spark Streaming for real-time
            smart-TV user behavior computation, and worked on early data-mining
            tasks such as K-means clustering and collaborative filtering.

    # ----------------------------------------------------------------
    # Section 3 — Capability highlights (domain-based, NOT per-company)
    # ----------------------------------------------------------------
    "Capability Highlights · Data Engineering & Analytics":
      - bullet: >-
          Data engineering foundation: 10 years across data platforms,
          warehouses, streaming systems, user profiling, event instrumentation,
          and analytics; hands-on with Spark, Flink, Kafka, Hive, HBase,
          Redash, Grafana, Kusto, Geneva, and Microsoft data tools such as
          Cosmos, Titan, and Power BI.
      - bullet: >-
          PB-scale MiPush data systems: owned real-time / offline push
          statistics, Android competitor analytics, and reporting for both
          internal Xiaomi teams and external developers. After taking over the
          competitor system, reduced statistical error versus BCI from 50%+ to
          10% through cleaning, mapping, and OAID compatibility work.
      - bullet: >-
          Warehouse refactoring and cost reduction: led the MiPush statistics
          platform rewrite, replacing old pulse-style HBase writes and weak
          data modeling with a more stable structure. The new design reduced
          HBase storage and saved nearly RMB 1M per year.
      - bullet: >-
          Business-facing analytics: built funnels, dashboards, AB scorecards,
          LTV / ROI analysis, and data-driven optimization loops for Skype,
          Bing App, Growth / Acquisition, Copilot Mac, and Connectivity.
          Examples include Skype 1v1 call success 88% → 98%, Copilot Mac new
          user retention 24.0% → 31.7%, and Voice TDR 46.3% → 31.93%.
      - bullet: >-
          Monitoring and data-quality systems: built systems that turn
          production issues into trackable, alertable, and reviewable data,
          from Meitu's company-wide anomaly detection platform with 98%+
          precision to Microsoft Geneva / Grafana monitors and CMC 1DS
          telemetry-loss RCA.

    "Capability Highlights · Full-Stack Product Engineering":
      - bullet: >-
          End-to-end engineering in data-heavy products: connects raw
          telemetry, cloud services, dashboards, scripts, and lightweight
          product surfaces into workflows that PMs, engineers, and data
          partners can use directly.
      - bullet: >-
          Microsoft Azure, telemetry, and Mac development: worked with Azure
          services, Copilot client telemetry instrumentation and metric design,
          and Copilot Mac feature development.
      - bullet: >-
          Internal tools and dashboards: over the past two years, built
          Python-heavy data visualizations, Kusto query helpers, MCP tools, and
          data-query agents for personal and team analysis / debugging
          workflows.
      - bullet: >-
          Full-stack open-source contributions: merged 15+ commits to
          `NousResearch/hermes-agent` across ACP, agent runtime, config, tools,
          Discord / Telegram / Desktop / Gateway, and 8+ PRs to
          `openclaw/openclaw` across messaging adapters, agent dispatch, and
          transport.
      - bullet: >-
          Self-built product practice: built and iterated Fawn, a private
          parenting agent with server, Android, and iOS components, along with
          `voice-buddy`, `code-while-shit`, `dashboard-gen-skill`,
          `golden-flower`, and other projects covering CLI, frontend, backend,
          agent integration, and dashboard delivery. Comfortable using
          AI-assisted coding to enter a new stack quickly and ship a usable
          version.

    "Capability Highlights · AI Agent Engineering":
      - bullet: >-
          1st Prize · FY25 Microsoft AI School China: submitted *Copilot Mac
          Data Query Agent* solo in the AI Agents track and won from the
          finalist projects across multiple Microsoft China AI training tracks.
      - bullet: >-
          Copilot Mac Data Agent: built a KG-RAG agent to improve Kusto query
          efficiency when only raw telemetry was available and no mature
          warehouse layer existed. The stack included OpenAI Agent SDK,
          MCP-style tool calling, Neo4j, a Kusto connector, and Azure Container
          Registry; the hard parts were metadata understanding, metric
          definition, and business context.
      - bullet: >-
          Agentic data workflow: gradually moved recurring data work such as
          KQL / SQL drafting, dashboard iteration, OCV reports, AB readouts,
          and single-user telemetry investigation into AI-assisted workflows,
          using data experience to constrain agent output quality.
      - bullet: >-
          Agent source-code study and open-source practice: independently
          maintains `Claude-Code-Source-Study` (1.5K+ stars / 530+ forks) and
          turned that source-reading practice into real merged contributions to
          Hermes Agent and OpenClaw.
      - bullet: >-
          AI-assisted debugging on large codebases: used multi-pass LLM-assisted
          reading across 40GB+ of Edge Chromium and Picasso source to support
          CMC bot-filter and terminal-event-loss RCA, applying agent workflows
          to production engineering and debugging rather than simple demos.

    # ----------------------------------------------------------------
    # Section 4 — Open Source / Public Engineering
    # (rendered with the "Projects" / "Open Source Projects" template
    # so each entry gets a clickable URL + summary + highlights.)
    # ----------------------------------------------------------------
    "Open Source Projects":
      - name: "Claude-Code-Source-Study"
        url: https://github.com/luyao618/Claude-Code-Source-Study
        meta: "1.5k+ stars / 536+ forks"
        summary: >-
          Personal source-code study project based on the Claude Code codebase
          released by Anthropic in Apr 2026. It is one of the most visible
          Chinese references for understanding Claude Code internals.
      - name: "Hermes Agent"
        url: https://github.com/NousResearch/hermes-agent/commits/main/?author=luyao618
        meta: "15 main commits · ACP / agent runtime / config / tools / multi-channel"
        summary: >-
          Merged contributions to `NousResearch/hermes-agent` main across ACP
          sessions, agent runtime, config validation, tool calling, and
          Discord / Telegram / Desktop / Gateway integrations.
      - name: "OpenClaw"
        url: "https://github.com/openclaw/openclaw/pulls?q=is%3Apr+author%3Aluyao618+is%3Amerged"
        meta: "8 merged PRs · messaging adapters / agent dispatch / transport"
        summary: >-
          Merged fixes to `openclaw/openclaw` across GoogleChat / Matrix
          adapters, active-memory deadlines, ACP dispatch, OpenRouter transport,
          and embedded session-takeover paths.
      - name: "AI-Native Productivity Tools"
        url: https://github.com/luyao618
        meta: "Python / TypeScript / HTML · CLI / dashboard / agent workflow"
        summary: >-
          Tool experiments around AI coding workflows, including `voice-buddy`,
          `dashboard-gen-skill`, `skila`, `watch-claw`, and `golden-flower`;
          the goal is to move ideas quickly into tools that run and can be
          reused.
      - name: "GitHub public engineering record"
        url: https://github.com/luyao618
        meta: "source study / AI-agent tools / data visualization / CLIs / lightweight web apps"
        summary: >-
          Public work spans source-code study, AI-agent tools, data
          visualization, CLIs, lightweight web apps, and game experiments.
          Main public languages include Python, TypeScript, JavaScript, HTML,
          Shell, C#, and GDScript.

