    - I have spent the past decade turning data platforms, warehouses, real-time pipelines, user profiles, and analytics systems into production software.
    - At Microsoft, I work across full-stack development and AI agent engineering, connecting data, product systems, and LLM workflows into usable tools.
    - Active in open source, with nearly 2K GitHub stars and contributions to well-known projects.

